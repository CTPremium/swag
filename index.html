<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>staruch</title>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Great+Vibes&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #fff;
            text-align: center;
        }

        .container {
            z-index: 10;
            padding: 15px 15px 120px 15px;
            max-width: 100%;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.2rem;
            margin: 0 0 25px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            animation: glow 2s ease-in-out infinite alternate;
            line-height: 1.05;
        }

        @keyframes glow {
            from { text-shadow: 0 0 15px #fff; }
            to { text-shadow: 0 0 30px #ff69b4, 0 0 40px #ff1493; }
        }

        .photo {
            width: 290px;
            height: 290px;
            border-radius: 50%;
            object-fit: cover;
            border: 12px solid white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin: 15px auto 25px;
        }

        .buttons-bottom {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 50;
            width: 90%;
            max-width: 320px;
        }

        .switch, #hammerBtn {
            padding: 13px 20px;
            border-radius: 50px;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            user-select: none;
            text-align: center;
        }

        #hammerBtn {
            background: #e91e63;
            color: white;
        }

        .switch {
            background: white;
            color: #333;
        }

        .switch:hover, #hammerBtn:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 92%;
            max-height: 78vh;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3rem;
            color: white;
            cursor: pointer;
        }

        .baloons {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        /* Poprawki dla telefonów */
        @media (max-width: 480px) {
            h1 {
                font-size: 2.9rem;
            }
            .photo {
                width: 235px;
                height: 235px;
                border-width: 10px;
            }
            .container {
                padding-bottom: 140px;
            }
            .buttons-bottom {
                bottom: 20px;
                gap: 10px;
                width: 92%;
            }
            .switch, #hammerBtn {
                padding: 12px 18px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="baloons"></div>

    <div class="container">
        <h1>Wszystkiego najlepszego,<br>Pani Maju!</h1>
        
        <img src="maja.jpg" 
             alt="Maja" class="photo" id="mainPhoto">

        <p style="font-size: 1.4rem; margin-top: 20px; opacity: 0.9;">
            Sto lat i chuuuuj pozdro od jakiza staruchu hej pa
        </p>
    </div>

    <div class="buttons-bottom">
        <div id="hammerBtn">🔨 przypierdol majce</div>
        <div class="switch" id="switch">🇺🇦 ja nie panimaju</div>
    </div>

    <div class="modal" id="modal">
        <span class="close" id="closeModal">×</span>
        <img src="ukrainiec.png" 
             alt="ukrainiec" id="secretImage">
    </div>

    <audio id="birthdayMusic" loop>
        <source src="https://media.vole.wtf/happy-birthday/jazz-trio.mp3" type="audio/mpeg">
    </audio>

    <audio id="hammerSound" preload="auto">
        <source src="https://www.soundjay.com/mechanical/sounds/hammering-1.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        const music = document.getElementById('birthdayMusic');
            let isPlaying = false;
        
            function startMusic() {
                if (isPlaying) return;
                
                music.play().then(() => {
                    isPlaying = true;
                }).catch(() => {
                });
            }

        document.body.addEventListener('click', startMusic, { once: true });
    
        document.querySelector('.container').addEventListener('click', startMusic);

        document.getElementById('switch').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'flex';
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.textContent = ['🎈','🎉','🥳','🎂','✨'][Math.floor(Math.random()*5)];
            balloon.style.position = 'absolute';
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.fontSize = Math.random() * 30 + 30 + 'px';
            balloon.style.opacity = Math.random() * 0.6 + 0.4;
            balloon.style.animation = `floatUp ${Math.random() * 8 + 10}s linear forwards`;
            document.querySelector('.baloons').appendChild(balloon);

            setTimeout(() => balloon.remove(), 20000);
        }

        setInterval(createBalloon, 400);

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes floatUp {
                0% { transform: translateY(110vh) rotate(0deg); }
                100% { transform: translateY(-100px) rotate(25deg); }
            }
        `;
        document.head.appendChild(style);
    </script>



<div id="hammerHit" style="position: absolute; font-size: 90px; opacity: 0; pointer-events: none; z-index: 50; transition: all 0.15s;">🔨</div>

<script>
const hammerBtn = document.getElementById('hammerBtn');
const photo = document.getElementById('mainPhoto');
const hammerHit = document.getElementById('hammerHit');
const hammerSound = document.getElementById('hammerSound');

hammerBtn.addEventListener('click', () => {
    hammerSound.currentTime = 0;
    hammerSound.play().catch(() => {});
    photo.style.transition = 'transform 0.1s';
    photo.style.transform = 'scale(0.92) translateY(8px)';

    const rect = photo.getBoundingClientRect();
    hammerHit.style.left = (rect.left + rect.width / 2 - 30) + 'px';
    hammerHit.style.top = (rect.top + rect.height / 2 - 60) + 'px';
    hammerHit.style.opacity = '1';
    hammerHit.style.transform = 'rotate(-35deg) scale(1.2)';

    if (typeof confetti !== 'undefined') {
        confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.7 }
        });
    }

    setTimeout(() => {
        photo.style.transform = 'scale(1) translateY(0)';
    }, 180);

    setTimeout(() => {
        hammerHit.style.opacity = '0';
        hammerHit.style.transform = 'rotate(0deg) scale(0.8)';
    }, 300);
});

const confettiScript = document.createElement('script');
confettiScript.src = "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js";
document.head.appendChild(confettiScript);
</script>
    
</body>
</html>
