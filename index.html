<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>staruch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Great+Vibes&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #fff;
            text-align: center;
        }

        .container {
            z-index: 10;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            margin: 0 0 30px 0;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 15px #fff; }
            to { text-shadow: 0 0 30px #ff69b4, 0 0 40px #ff1493; }
        }

        .photo {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            object-fit: cover;
            border: 12px solid white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            margin: 20px auto;
        }

        .switch {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            color: #333;
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: all 0.3s;
            user-select: none;
        }

        .switch:hover {
            transform: scale(1.08);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 3rem;
            color: white;
            cursor: pointer;
        }

        .baloons {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="baloons"></div>

    <div class="container">
        <h1>Wszystkiego najlepszego,<br>Pani Maju!</h1>
        
        <img src="maja.jpg" 
             alt="Maja" class="photo" id="mainPhoto">

        <p style="font-size: 1.4rem; margin-top: 20px; opacity: 0.9;">
            Sto lat i chuuuuj pozdro od jakiza
        </p>
    </div>

    <div class="switch" id="switch">
        🇺🇦 ja nie panimaju
    </div>

    <div class="modal" id="modal">
        <span class="close" id="closeModal">×</span>
        <img src="ukrainiec.png" 
             alt="ukrainiec" id="secretImage">
    </div>

    <audio id="birthdayMusic" loop>
        <source src="https://media.vole.wtf/happy-birthday/jazz-trio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('birthdayMusic');
            let isPlaying = false;
        
            function startMusic() {
                if (isPlaying) return;
                
                music.play().then(() => {
                    isPlaying = true;
                }).catch(() => {
                });
            }

        document.getElementById('switch').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'flex';
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.textContent = ['🎈','🎉','🥳','🎂','✨'][Math.floor(Math.random()*5)];
            balloon.style.position = 'absolute';
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.fontSize = Math.random() * 30 + 30 + 'px';
            balloon.style.opacity = Math.random() * 0.6 + 0.4;
            balloon.style.animation = `floatUp ${Math.random() * 8 + 10}s linear forwards`;
            document.querySelector('.baloons').appendChild(balloon);

            setTimeout(() => balloon.remove(), 20000);
        }

        setInterval(createBalloon, 400);

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes floatUp {
                0% { transform: translateY(110vh) rotate(0deg); }
                100% { transform: translateY(-100px) rotate(25deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
